name = "copa-2026-api"
main = "src/index.ts"
compatibility_date = "2026-06-22"

[[kv_namespaces]]
binding = "CACHE"
id = "f148acd25aba436b8c11368e35653ee0"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

[triggers]
crons = ["* * * * *"]

# Public vars (non-secret). The API token is set separately:
#   npx wrangler secret put FOOTBALL_DATA_TOKEN
[vars]
ALLOWED_ORIGIN = "https://sergiogbernardo.github.io"
